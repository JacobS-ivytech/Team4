{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <div class="bg-light rounded d-flex align-items-center justify-content-center" style="height: 400px;">
                <i class="bi bi-image text-muted" style="font-size: 5rem;"></i>
            </div>
        </div>
        <div class="col-md-6">
            <p class="text-muted mb-1">{{ item.category.name }}</p>
            <h1 class="mb-3">{{ item.name }}</h1>
            {% if item.description %}
                <p class="lead mb-4">{{ item.description }}</p>
            {% endif %}
            <div class="d-flex justify-content-between align-items-center mb-4">
                <span class="badge bg-primary fs-4">${{ item.price }}</span>
                {% if item.is_available %}
                    <a href="{% url 'add_to_cart' item.id %}" class="btn btn-success btn-lg">Add to Cart</a>
                {% else %}
                    <button class="btn btn-secondary btn-lg" disabled>Sold Out</button>
                {% endif %}
            </div>
            <a href="{% url 'menu' %}" class="btn btn-outline-primary">Back to Menu</a>
        </div>
    </div>
</div>
{% endblock content %}
